<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c4a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="250" fill="#1a2d1d"/>
  
  <!-- Decorative corner elements -->
  <rect x="0" y="0" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="180" y="0" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="0" y="230" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="180" y="230" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#skinTone)"/>
  
  <!-- Hair (Groom style) -->
  <path d="M 65,70 Q 65,40 100,35 Q 135,40 135,70" fill="#2c2c2c"/>
  
  <!-- Eyes -->
  <circle cx="88" cy="65" r="4" fill="#2c2c2c"/>
  <circle cx="112" cy="65" r="4" fill="#2c2c2c"/>
  
  <!-- Nose -->
  <path d="M 100,70 L 100,80" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Smile -->
  <path d="M 88,85 Q 100,90 112,85" stroke="#d4a574" stroke-width="2" fill="none"/>
  
  <!-- Neck -->
  <rect x="92" y="100" width="16" height="15" fill="url(#skinTone)"/>
  
  <!-- Formal Attire (Groom) -->
  <g>
    <!-- Shirt -->
    <rect x="60" y="115" width="80" height="70" fill="#1a1a2e" rx="5"/>
    
    <!-- Tie -->
    <path d="M 98,115 L 95,135 L 100,155 L 105,135 L 102,115 Z" fill="#d4af37"/>
    
    <!-- Shirt Details -->
    <circle cx="85" cy="130" r="2" fill="#d4af37" opacity="0.5"/>
    <circle cx="115" cy="130" r="2" fill="#d4af37" opacity="0.5"/>
    
    <!-- Jacket -->
    <path d="M 60,120 L 55,180 Q 50,200 70,210 L 130,210 Q 150,200 145,180 L 140,120" fill="#0d0d1a" opacity="0.8"/>
  </g>
  
  <!-- Decorative frame -->
  <rect x="5" y="5" width="190" height="240" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.4"/>
</svg>