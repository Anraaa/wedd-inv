<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c4a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="250" fill="#1a2d1d"/>
  
  <!-- Decorative corner elements -->
  <rect x="0" y="0" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="180" y="0" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="0" y="230" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="180" y="230" width="20" height="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#skinTone)"/>
  
  <!-- Hair (Bride style - long) -->
  <path d="M 65,70 Q 65,40 100,35 Q 135,40 135,70 Q 135,90 130,110 Q 125,120 120,125" fill="#3d2a1f"/>
  <path d="M 70,85 Q 65,100 68,125" fill="#3d2a1f"/>
  <path d="M 130,85 Q 135,100 132,125" fill="#3d2a1f"/>
  
  <!-- Veil/Tiara -->
  <path d="M 70,50 Q 75,40 100,35 Q 125,40 130,50 Q 128,55 100,60 Q 72,55 70,50" fill="#f3e5ab" opacity="0.7"/>
  <circle cx="100" cy="45" r="3" fill="#d4af37"/>
  
  <!-- Eyes -->
  <circle cx="88" cy="65" r="4" fill="#2c2c2c"/>
  <circle cx="112" cy="65" r="4" fill="#2c2c2c"/>
  <circle cx="89" cy="64" r="1.5" fill="white"/>
  <circle cx="113" cy="64" r="1.5" fill="white"/>
  
  <!-- Nose -->
  <path d="M 100,70 L 100,80" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Lips -->
  <path d="M 88,85 Q 100,90 112,85 Q 100,95 88,85" fill="#d4a574" opacity="0.7"/>
  
  <!-- Neck -->
  <rect x="92" y="100" width="16" height="15" fill="url(#skinTone)"/>
  
  <!-- Formal Attire (Bride - White Dress) -->
  <g>
    <!-- Dress Body -->
    <path d="M 60,115 Q 55,130 52,160 Q 50,190 70,210 L 130,210 Q 150,190 148,160 Q 145,130 140,115 Z" fill="#fbf9f1"/>
    
    <!-- Dress Details -->
    <path d="M 65,120 Q 60,125 62,135" stroke="#d4af37" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 135,120 Q 140,125 138,135" stroke="#d4af37" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Necklace -->
    <circle cx="100" cy="115" r="2" fill="#d4af37"/>
    <path d="M 95,115 Q 90,120 92,125" stroke="#d4af37" stroke-width="1.5" fill="none"/>
    <path d="M 105,115 Q 110,120 108,125" stroke="#d4af37" stroke-width="1.5" fill="none"/>
    
    <!-- Shoulder Details (lace effect) -->
    <circle cx="62" cy="118" r="3" fill="#d4af37" opacity="0.4"/>
    <circle cx="65" cy="120" r="2" fill="#d4af37" opacity="0.3"/>
    <circle cx="138" cy="118" r="3" fill="#d4af37" opacity="0.4"/>
    <circle cx="135" cy="120" r="2" fill="#d4af37" opacity="0.3"/>
  </g>
  
  <!-- Decorative frame -->
  <rect x="5" y="5" width="190" height="240" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.4"/>
</svg>