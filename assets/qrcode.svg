<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="white"/>
  
  <!-- QR Pattern (Simplified representation) -->
  <defs>
    <pattern id="qrPattern" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="white"/>
      <rect width="7" height="7" fill="#112014"/>
      <rect x="8" y="8" width="7" height="7" fill="#112014"/>
    </pattern>
  </defs>
  
  <!-- QR Code Area -->
  <rect x="15" y="15" width="270" height="270" fill="url(#qrPattern)"/>
  
  <!-- Position Markers (3 corners) -->
  <!-- Top Left -->
  <g transform="translate(30, 30)">
    <rect width="40" height="40" fill="none" stroke="#112014" stroke-width="3"/>
    <rect x="8" y="8" width="24" height="24" fill="none" stroke="#112014" stroke-width="2"/>
    <rect x="14" y="14" width="12" height="12" fill="#112014"/>
  </g>
  
  <!-- Top Right -->
  <g transform="translate(230, 30)">
    <rect width="40" height="40" fill="none" stroke="#112014" stroke-width="3"/>
    <rect x="8" y="8" width="24" height="24" fill="none" stroke="#112014" stroke-width="2"/>
    <rect x="14" y="14" width="12" height="12" fill="#112014"/>
  </g>
  
  <!-- Bottom Left -->
  <g transform="translate(30, 230)">
    <rect width="40" height="40" fill="none" stroke="#112014" stroke-width="3"/>
    <rect x="8" y="8" width="24" height="24" fill="none" stroke="#112014" stroke-width="2"/>
    <rect x="14" y="14" width="12" height="12" fill="#112014"/>
  </g>
  
  <!-- Timing Pattern (horizontal & vertical lines) -->
  <line x1="60" y1="70" x2="240" y2="70" stroke="#112014" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="60" x2="70" y2="240" stroke="#112014" stroke-width="1" opacity="0.3"/>
  
  <!-- Center Data Area with pattern -->
  <g transform="translate(120, 120)">
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="15" fill="white" stroke="#d4af37" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#112014">QR</text>
  </g>
  
  <!-- Decorative Border -->
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
</svg>