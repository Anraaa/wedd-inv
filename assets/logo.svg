<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5ab;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main Design - Two Rings -->
  <g transform="translate(100, 100)">
    <!-- Left Ring -->
    <circle cx="-15" cy="0" r="20" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <!-- Right Ring -->
    <circle cx="15" cy="0" r="20" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
    
    <!-- Center Heart -->
    <path d="M -5,-8 C -8,-12 -15,-12 -15,-6 C -15,0 -5,8 0,12 C 5,8 15,0 15,-6 C 15,-12 8,-12 5,-8" 
          fill="url(#logoGrad)" opacity="0.7"/>
    
    <!-- Decorative Leaves -->
    <path d="M -30,5 Q -35,0 -30,-5" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
    <path d="M 30,5 Q 35,0 30,-5" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="155" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="bold" 
        text-anchor="middle" fill="url(#logoGrad)" letter-spacing="2">RAFI & ADINDA</text>
  <text x="100" y="172" font-family="'Cormorant Garamond', serif" font-size="10" 
        text-anchor="middle" fill="url(#logoGrad)" opacity="0.8" letter-spacing="1">14 JUNI 2025</text>
</svg>